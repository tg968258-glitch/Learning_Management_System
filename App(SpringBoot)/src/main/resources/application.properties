spring.application.name=lms-backend
spring.config.import=optional:classpath:application-local.properties

# ─── PostgreSQL ─────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/lms_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ─── Flyway ──────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ─── JWT ─────────────────────────────────────────────────────────────────────
app.jwt.secret=your-very-secure-jwt-secret-key-at-least-256-bits-long-here
app.jwt.expiration-minutes=30
app.jwt.refresh-expiration-days=7

# ─── Admin Defaults ──────────────────────────────────────────────────────────
app.admin.username=admin
app.admin.email=admin@lms.com
app.admin.password=admin123

# ─── File Storage ────────────────────────────────────────────────────────────
app.upload.dir=./uploads
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# ─── JavaMail (SMTP) ─────────────────────────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ─── Mail From ────────────────────────────────────────────────────────────────
app.mail.from=your-email@gmail.com
app.mail.from-name=LMS Platform

# ─── SpringDoc / Swagger ──────────────────────────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ─── Logging ─────────────────────────────────────────────────────────────────
logging.level.com.Project.LearningManagementSystem=INFO
logging.level.org.flywaydb=INFO

# ─── Caching (Valkey / Redis) ────────────────────────────────────────────────
spring.data.redis.host=${VALKEY_HOST:localhost}
spring.data.redis.port=${VALKEY_PORT:6379}
spring.data.redis.username=${VALKEY_USERNAME:default}
spring.data.redis.password=${VALKEY_PASSWORD:}
spring.data.redis.ssl.enabled=${VALKEY_SSL_ENABLED:false}

spring.cache.type=redis
spring.cache.redis.time-to-live=600000