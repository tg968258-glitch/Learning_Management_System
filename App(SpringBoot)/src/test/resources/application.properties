spring.application.name=lms-backend-test

# ─── H2 In-Memory Database for Testing ────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# ─── Flyway Disabled in Test ──────────────────────────────────────────────────
spring.flyway.enabled=false

# ─── Test JWT ────────────────────────────────────────────────────────────────
app.jwt.secret=test-jwt-secret-key-that-is-at-least-256-bits-long-for-testing-purposes-only
app.jwt.expiration-minutes=60
app.jwt.refresh-expiration-days=1

# ─── Mail Mock / Dummy ────────────────────────────────────────────────────────
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@lms.com
spring.mail.password=testpassword

app.mail.from=test@lms.com
app.mail.from-name=LMS Test Platform
app.upload.dir=./target/test-uploads
